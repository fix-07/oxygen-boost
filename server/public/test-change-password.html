<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<title>اختبار: تغيير كلمة مرور المشرف</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
  fieldset { margin-bottom: 24px; padding: 16px; }
  label { display: block; margin-top: 10px; font-size: 14px; }
  input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
  button { margin-top: 14px; padding: 8px 16px; cursor: pointer; }
  pre { background: #f2f2f2; padding: 10px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<h1>اختبار API — تغيير كلمة مرور المشرف</h1>
<p>أداة تطوير فقط، غير متاحة في الإنتاج.</p>

<fieldset>
  <legend>١) تسجيل الدخول</legend>
  <label>البريد الإلكتروني<input id="email" type="email" autocomplete="username" /></label>
  <label>كلمة المرور<input id="loginPassword" type="password" autocomplete="current-password" /></label>
  <button id="loginBtn">دخول</button>
</fieldset>

<fieldset>
  <legend>٢) تغيير كلمة المرور</legend>
  <label>كلمة المرور الحالية<input id="currentPassword" type="password" autocomplete="current-password" /></label>
  <label>كلمة المرور الجديدة (٨ أحرف على الأقل)<input id="newPassword" type="password" autocomplete="new-password" /></label>
  <button id="changeBtn" disabled>تغيير</button>
</fieldset>

<pre id="log">بانتظار تسجيل الدخول…</pre>

<script>
  let token = null
  const log = (msg) => { document.getElementById('log').textContent = msg }

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('email').value
    const password = document.getElementById('loginPassword').value
    log('...جارٍ تسجيل الدخول')
    try {
      const res = await fetch('/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      })
      const data = await res.json()
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`)
      token = data.token
      document.getElementById('changeBtn').disabled = false
      log('تم تسجيل الدخول. يمكنك الآن تغيير كلمة المرور.')
    } catch (err) {
      token = null
      document.getElementById('changeBtn').disabled = true
      log('خطأ في تسجيل الدخول: ' + err.message)
    }
  })

  document.getElementById('changeBtn').addEventListener('click', async () => {
    if (!token) return
    const currentPassword = document.getElementById('currentPassword').value
    const newPassword = document.getElementById('newPassword').value
    log('...جارٍ التغيير')
    try {
      const res = await fetch('/admin/password', {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + token,
        },
        body: JSON.stringify({ currentPassword, newPassword }),
      })
      const data = await res.json()
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`)
      log('تم تغيير كلمة المرور بنجاح.')
    } catch (err) {
      log('خطأ: ' + err.message)
    }
  })
</script>
</body>
</html>
